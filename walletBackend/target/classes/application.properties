spring.application.name=wallet-backend

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL: override these values through environment variables for each environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wallet_ledger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sardukar@101#}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Scheduling: hourly settlement must not occupy the only thread and block auto-unlock.
spring.task.scheduling.pool.size=4

# Query params such as ?fromDate=2026-10-01 bind to LocalDate.
spring.mvc.format.date=iso

# Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Security & JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
